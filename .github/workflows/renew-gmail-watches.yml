name: Renew Gmail watches (Alfredo)

# Renouvelle quotidiennement les Gmail watches Pub/Sub qui expirent dans < 24h.
# Cf. scripts/renew-gmail-watches.ts et docs Plan C Task 15.
#
# Secrets requis (GitHub > Settings > Secrets > Actions) :
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - OAUTH_TOKENS_ENCRYPTION_KEY
#   - GCP_PROJECT_ID
#   - GMAIL_PUSH_TOPIC

on:
  schedule:
    # Tous les jours à 03:17 UTC (heure off-peak)
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    name: Renouveler les watches Gmail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tsx n'est pas dans le lockfile : version épinglée, comme @axe-core/playwright dans tests.yml.
      # « npx tsx » téléchargeait la dernière version publiée à chaque passage, avec les secrets ci-dessous
      # dans l'environnement du script.
      - name: Installer tsx (version épinglée)
        run: npm install --no-save --ignore-scripts tsx@4.23.15

      - name: Run renew script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OAUTH_TOKENS_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKENS_ENCRYPTION_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GMAIL_PUSH_TOPIC: ${{ secrets.GMAIL_PUSH_TOPIC }}
        run: node_modules/.bin/tsx scripts/renew-gmail-watches.ts

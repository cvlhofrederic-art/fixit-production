name: Security — Daily Scan

on:
  schedule:
    - cron: '17 3 * * *'  # 3h17 UTC = 4h17 FR (heure creuse, minute décalée)
  workflow_dispatch:  # Lancement manuel

concurrency:
  group: security-daily
  cancel-in-progress: true

# Aucune permission au niveau du workflow (lot 6 Aikido, 28/10/2026) : chaque job
# déclare le strict nécessaire (issues: write uniquement pour le job de rapport).
permissions: {}

jobs:
  trivy:
    name: Trivy — Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'json'
          output: 'trivy-results.json'
          ignore-unfixed: true
          trivyignores: 'security/.trivyignore'

      - name: Check for critical vulnerabilities
        id: trivy-check
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
          {
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy Results"
            echo "- Critical: $CRITICAL"
            echo "- High: $HIGH"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 7

  # ── Gitleaks — même méthode que gitleaks.yml (lot 6 Aikido, 28/10/2026) ──────
  # Binaire officiel à somme sha256 vérifiée, pas gitleaks/gitleaks-action (licence
  # exigée pour les organisations). Scan de TOUT l'historique git.
  gitleaks:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 de gitleaks_8.30.1_linux_x64.tar.gz, relevée dans gitleaks_8.30.1_checksums.txt de la release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout du code (historique complet, sans jeton persistant)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for secret scanning

      - name: Installer gitleaks (binaire officiel, somme sha256 vérifiée)
        run: |
          set -euo pipefail
          dossier="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dossier"
          curl -sSL --fail --retry 3 -o "$dossier/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dossier/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dossier/gitleaks.tar.gz" -C "$dossier" gitleaks
          rm -f "$dossier/gitleaks.tar.gz"
          echo "$dossier" >> "$GITHUB_PATH"
          "$dossier/gitleaks" version

      - name: Run Gitleaks (tout l'historique)
        id: gitleaks
        # continue-on-error conservé : l'historique contient encore des secrets non
        # tournés (commits af2983ea, d95a36ba, 2850d429, 92e744ad), signalés à dessein
        # jusqu'à leur rotation par Frédéric ; le rapport quotidien les mentionne
        # (statut failed) sans faire échouer le workflow.
        continue-on-error: true
        run: gitleaks git . --redact --config security/.gitleaks.toml --exit-code 1 --no-banner

      - name: Report
        env:
          # Résultat de l'étape passé par l'environnement, jamais interpolé dans run:.
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$GITLEAKS_OUTCOME" == "failure" ]; then
            echo "### Gitleaks: Secrets detected" >> "$GITHUB_STEP_SUMMARY"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "### Gitleaks: Clean" >> "$GITHUB_STEP_SUMMARY"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

  nuclei:
    name: Nuclei — DAST Web Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run Nuclei scan
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          target: https://vitfix.io
          flags: "-severity medium,high,critical -rate-limit 10 -bulk-size 5 -concurrency 3 -timeout 10 -retries 1 -exclude-templates fuzzing/ -exclude-templates headless/ -silent"
          output: nuclei-results.txt
        continue-on-error: true

      - name: Parse results
        id: nuclei-check
        run: |
          if [ -f nuclei-results.txt ] && [ -s nuclei-results.txt ]; then
            COUNT=$(wc -l < nuclei-results.txt)
            CRITICAL=$(grep -c "\[critical\]" nuclei-results.txt || true)
            HIGH=$(grep -c "\[high\]" nuclei-results.txt || true)
            {
              echo "findings=$COUNT"
              echo "critical=$CRITICAL"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Nuclei Results"
              echo "- Total findings: $COUNT"
              echo "- Critical: $CRITICAL"
              echo "- High: $HIGH"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "findings=0"
              echo "critical=0"
            } >> "$GITHUB_OUTPUT"
            echo "### Nuclei: Clean" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nuclei-results
          path: nuclei-results.txt
          retention-days: 7

  semgrep-full:
    name: Semgrep — Full SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Image épinglée par digest (zizmor unpinned-images, lot 6 Aikido) : digest du
      # manifeste multi-arch de semgrep/semgrep:latest = 1.181.1 au 28/10/2026.
      image: semgrep/semgrep:1.181.1@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run Semgrep (custom + OWASP)
        run: |
          semgrep scan \
            --config security/.semgrep.yml \
            --config p/owasp-top-ten \
            --config p/nextjs \
            --json \
            --output semgrep-results.json \
            --severity ERROR \
            || true

      - name: Parse results
        id: semgrep-check
        run: |
          if [ -f semgrep-results.json ]; then
            ERRORS=$(cat semgrep-results.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('extra',{}).get('severity','') == 'ERROR']))" 2>/dev/null || echo "0")
            TOTAL=$(cat semgrep-results.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('results',[])))" 2>/dev/null || echo "0")
            {
              echo "errors=$ERRORS"
              echo "total=$TOTAL"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Semgrep Results"
              echo "- Errors: $ERRORS"
              echo "- Total findings: $TOTAL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "errors=0"
              echo "total=0"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 7

  report:
    name: Security Report
    needs: [trivy, gitleaks, nuclei, semgrep-full]
    runs-on: ubuntu-latest
    if: always()
    # Pas de checkout : le rapport n'utilise rien du dépôt (artefacts du run seulement).
    permissions:
      issues: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: scan-results/
        continue-on-error: true

      - name: Generate report
        id: report
        env:
          # Résultats des jobs passés par l'environnement, jamais interpolés dans run:.
          # GITHUB_RUN_ID, GITHUB_SERVER_URL et GITHUB_REPOSITORY sont fournis par le runner.
          TRIVY_STATUS: ${{ needs.trivy.result }}
          GITLEAKS_STATUS: ${{ needs.gitleaks.result }}
          NUCLEI_STATUS: ${{ needs.nuclei.result }}
          SEMGREP_STATUS: ${{ needs.semgrep-full.result }}
        run: |
          HAS_FAILURES="false"
          if [ "$TRIVY_STATUS" == "failure" ] || [ "$GITLEAKS_STATUS" == "failure" ]; then
            HAS_FAILURES="true"
          fi

          echo "has_failures=$HAS_FAILURES" >> "$GITHUB_OUTPUT"

          # Build report body
          cat > report.md << 'REPORT_EOF'
          ## Daily Security Scan Report

          | Scanner | Status | Details |
          |---------|--------|---------|
          REPORT_EOF

          {
            echo "| Trivy (deps) | $( [ "$TRIVY_STATUS" == "success" ] && echo "✅ Pass" || echo "❌ $TRIVY_STATUS" ) | Dependency vulnerabilities |"
            echo "| Gitleaks | $( [ "$GITLEAKS_STATUS" == "success" ] && echo "✅ Pass" || echo "❌ $GITLEAKS_STATUS" ) | Secret detection |"
            echo "| Nuclei (DAST) | $( [ "$NUCLEI_STATUS" == "success" ] && echo "✅ Pass" || echo "⚠️ $NUCLEI_STATUS" ) | Web vulnerability scan |"
            echo "| Semgrep (SAST) | $( [ "$SEMGREP_STATUS" == "success" ] && echo "✅ Pass" || echo "❌ $SEMGREP_STATUS" ) | Static code analysis |"
            echo ""
            echo "Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "Date: $(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> report.md

      - name: Create issue if failures
        if: steps.report.outputs.has_failures == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security Alert — Daily Scan ${date}`,
              body: body,
              labels: ['security', 'automated']
            });

      - name: Summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

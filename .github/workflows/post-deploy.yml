# ── Post-Deploy Smoke Test ────────────────────────────────────────────────────
# Vérifie que la production répond correctement après chaque deploy sur main.
# Se déclenche après le workflow "Deploy to Cloudflare Workers" (pipeline prod).

name: "Post-Deploy — Smoke Test"

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  PROD_URL: https://vitfix.io

jobs:
  smoke-test:
    name: "Smoke test production"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Attendre la propagation Cloudflare
        run: sleep 30

      - name: Vérifier /api/health
        run: |
          HTTP_STATUS=$(curl -sL -o /tmp/health.json -w "%{http_code}" "$PROD_URL/api/health")
          echo "Status: $HTTP_STATUS"
          cat /tmp/health.json | jq .
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Vérifier la page d'accueil FR
        run: |
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$PROD_URL/fr/")
          echo "Homepage FR status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Homepage FR returned $HTTP_STATUS"
            exit 1
          fi

      - name: Vérifier la page d'accueil PT
        run: |
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$PROD_URL/pt/")
          echo "Homepage PT status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Homepage PT returned $HTTP_STATUS"
            exit 1
          fi

      - name: Préchauffer le cache des pages publiques PT
        if: success()
        # Le Worker met en cache le HTML des pages publiques (worker/cache-pages-publiques.ts, clé par déploiement) ;
        # chaque URL des sitemaps PT, plus /pt/ et /fr/, est demandée une fois, en parallèle (lot 7 Sentry du
        # 28/10/2026). Le Cache API des Workers est propre à chaque centre de données Cloudflare : lancé depuis un
        # runner GitHub (en général aux États-Unis), ce préchauffage ne remplit que le cache du ou des centres de
        # données qui servent ce runner. Il ne profite qu'aux requêtes routées vers ces mêmes centres de données,
        # comme une partie de l'exploration de Googlebot (surtout depuis les États-Unis), pas aux visiteurs du
        # Portugal, dont le centre de données se remplit à leurs propres visites. Best-effort, 4 minutes au plus.
        continue-on-error: true
        run: |
          set -u
          # HTTPS imposé, redirections comprises (SonarCloud S6506) : jamais de passage en clair.
          CURL="curl -sL --proto =https --proto-redir =https"
          sous_sitemaps=$($CURL "$PROD_URL/pt/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          urls=$( (echo "$PROD_URL/pt/"; echo "$PROD_URL/fr/"; for s in $sous_sitemaps; do $CURL "$s" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g'; done) | sort -u)
          echo "$(echo "$urls" | wc -l) URL à préchauffer"
          echo "$urls" | timeout 240 xargs -r -P 8 -n 1 sh -c 'curl -sL --proto =https --proto-redir =https -o /dev/null -w "%{http_code} %{time_starttransfer}s $0\n" "$0"' > /tmp/prechauffage.txt || true
          echo "réponses : $(wc -l < /tmp/prechauffage.txt)"
          awk '{print $1}' /tmp/prechauffage.txt | sort | uniq -c
          echo "les 5 plus lentes :"; sort -k2 -r /tmp/prechauffage.txt | head -5

      - name: Ping IndexNow (Bing / Yandex / Naver / Seznam)
        if: success()
        # IndexNow accélère l'indexation des changements sur Bing / Yandex.
        # Pour Google, c'est la fetch du sitemap qui fait foi (Google ignore IndexNow).
        # Clé publique exposée à https://vitfix.io/{key}.txt — voir lib/seo/indexnow.ts.
        # Ne fait jamais échouer le job (continue-on-error) : SEO best-effort.
        continue-on-error: true
        run: |
          KEY="f35626783ac34c45b8aed85303d1f5a8"
          HOST="vitfix.io"
          # On soumet uniquement les hubs principaux (homepage + entrées sitemap).
          # Les sub-sitemaps ne sont pas eux-mêmes des URLs indexables.
          URLS='[
            "https://vitfix.io/",
            "https://vitfix.io/fr/",
            "https://vitfix.io/pt/",
            "https://vitfix.io/en/",
            "https://vitfix.io/sitemap.xml"
          ]'
          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" \
            --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urls}')
          HTTP_STATUS=$(curl -sL -o /tmp/indexnow.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow status: $HTTP_STATUS"
          cat /tmp/indexnow.txt || true
          # 200 / 202 = OK, 422 = quota, 4xx = erreur clé. On log mais on échoue pas.

      - name: Résumé
        if: success()
        run: echo "✓ Production smoke test passed — all endpoints healthy"

      - name: Alerte échec
        if: failure()
        run: |
          echo "::error::PRODUCTION SMOKE TEST FAILED — vérifier https://vitfix.io immédiatement"
          echo "Rollback: wrangler rollback ou redéployer le commit précédent via le workflow 'Deploy to Cloudflare Workers'"

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "!.github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

# Un seul déploiement à la fois, mis en file d'attente, jamais annulé : la
# concurrence couvre tout le run (build + deploy, smoke test, ping IndexNow).
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# Aucune permission au niveau du workflow (lot 6 Aikido, 28/10/2026) :
# chaque job déclare le strict nécessaire.
permissions: {}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://vitfix.io

    # contents: read suffit : wrangler-action n'appelle l'API GitHub Deployments que pour
    # `pages deploy` avec l'entrée gitHubToken (absente ici : commande `deploy` Workers), et
    # le déploiement d'environnement « production » est créé par le service Actions sans
    # permission du jeton. L'ancien `deployments: write` est retiré (relecture du lot 6).
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Aucun jeton persistant dans .git/config : rien ne pousse depuis ce job.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          # Node 22 minimum : wrangler ≥ 4.86 le requiert (le deploy échouait en
          # boucle sur Node 20 — « Wrangler requires at least Node.js v22.0.0 »).
          node-version: "22"
          # Pas de cache npm dans ce workflow de publication (zizmor cache-poisoning,
          # lot 6 Aikido) : un cache restauré ici finirait dans le bundle déployé en
          # production. `npm ci` reste exact, juste un peu plus long. setup-node ≥ 5
          # active le cache par défaut : il faut le refuser explicitement.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://vitfix.io
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Polices Google (next/font) parfois injoignables depuis les runners : reprise ciblée
          # sur cette seule erreur (scripts/ci-build-avec-reprise.sh), comme ci.yml et tests.yml.
          COMMANDE_BUILD: npx @opennextjs/cloudflare build
          TENTATIVES_BUILD: "4"
          PAUSE_BUILD_SECONDES: "45"
        run: bash scripts/ci-build-avec-reprise.sh

      # Pages pré-rendues servies par le Worker (open-next.config.ts : cache incrémental en assets statiques, lecture
      # seule). Même copie que `opennextjs-cloudflare populateCache` pour ce cache (populateStaticAssetsIncrementalCache) ;
      # si wrangler délègue le déploiement à `opennextjs-cloudflare deploy` (projet OpenNext détecté), la copie est refaite
      # à l'identique. Cette étape la garantit, après la garde du pré-rendu (même script que ci.yml : chaque page de
      # section pré-rendue sauf liste nommée, planchers, pages témoins, aucun revalidate). Les fichiers de cdn-cgi/ ne
      # sont lisibles que par le Worker, jamais servis tels quels aux visiteurs.
      - name: Pages pré-rendues dans les assets du Worker
        run: |
          set -euo pipefail
          node scripts/seo/verifier-prerendu.mjs
          test -d .open-next/cache || { echo "::error::.open-next/cache absent : le build OpenNext n'a rien pré-rendu."; exit 1; }
          mkdir -p .open-next/assets/cdn-cgi/_next_cache
          cp -R .open-next/cache/. .open-next/assets/cdn-cgi/_next_cache/
          nombre=$(find .open-next/assets/cdn-cgi/_next_cache -name '*.cache' | wc -l)
          echo "Pages pré-rendues copiées : $nombre"
          if [ "$nombre" -eq 0 ]; then
            echo "::error::Aucune page pré-rendue (.cache) copiée : le Worker rendrait chaque page à la demande."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        env:
          # Clé anon Supabase sortie de wrangler.toml (lot 1 Aikido, 28/10/2026) : aucune valeur dans
          # le dépôt. Le même secret GitHub que l'étape de build est passé au Worker par l'action
          # (entrée `vars` ci-dessous → `wrangler deploy --var NEXT_PUBLIC_SUPABASE_ANON_KEY:…`).
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Variables d'environnement du Worker injectées au déploiement depuis `env:` ci-dessus
          # (une par ligne) : la clé anon reste lisible au runtime (process.env dynamique dans
          # lib/env.ts et app/api/health) sans figurer dans [vars] de wrangler.toml.
          vars: |
            NEXT_PUBLIC_SUPABASE_ANON_KEY
          # Sans wranglerVersion, l'action installe SA version par défaut
          # (vieille) au lieu de celle du lockfile : les assets @vercel/og de
          # next 16.x cassent son module-collector. 4.149.0 = version du
          # lockfile (build OpenNext 1.20.12, next 16.4.2). OpenNext ≥ 1.20.10
          # exige wrangler ≥ 4.148 ; 4.149.0 est la première dont miniflare
          # embarque sharp 0.35.5 (GHSA-wq5f-xc86-pv6w corrigé).
          # Garder aligné avec devDependencies.wrangler.
          wranglerVersion: "4.149.0"

      - name: Smoke test
        run: |
          sleep 10
          # Follow redirects (middleware sends / → /fr/) and check final 200
          for url in https://vitfix.io https://vitfix.io/fr https://vitfix.io/robots.txt; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
            echo "$url → $code"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke test failed for $url (HTTP $code)"
              exit 1
            fi
          done

  # ── Smoke test de la production (ex post-deploy.yml, lot 6 Aikido 28/10/2026) ──
  # L'ancien déclencheur « après fin du workflow de déploiement » (zizmor
  # dangerous-triggers, High) est remplacé par un job du pipeline lui-même : après
  # propagation Cloudflare, /api/health (JSON), puis les pages d'accueil FR et PT.
  # Pas de checkout : rien du dépôt n'est utilisé.
  smoke-test:
    name: Smoke test production
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Aucun jeton nécessaire : pas de checkout ni d'appel à l'API GitHub (curl et jq
    # vers vitfix.io seulement) : moindre privilège.
    permissions: {}
    env:
      PROD_URL: https://vitfix.io

    steps:
      - name: Attendre la propagation Cloudflare
        run: sleep 30

      - name: Vérifier /api/health
        run: |
          HTTP_STATUS=$(curl -sL -o /tmp/health.json -w "%{http_code}" "$PROD_URL/api/health")
          echo "Status: $HTTP_STATUS"
          cat /tmp/health.json | jq .
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Vérifier la page d'accueil FR
        run: |
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$PROD_URL/fr/")
          echo "Homepage FR status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Homepage FR returned $HTTP_STATUS"
            exit 1
          fi

      - name: Vérifier la page d'accueil PT
        run: |
          HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$PROD_URL/pt/")
          echo "Homepage PT status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Homepage PT returned $HTTP_STATUS"
            exit 1
          fi

      # Pages pré-rendues servies depuis les assets du Worker : si la copie de .open-next/cache manquait ou si OpenNext
      # changeait de chemin, chaque page serait de nouveau rendue à la demande, avec une réponse 200 quand même.
      - name: Vérifier que les pages SEO viennent du cache
        run: |
          ENTETE=$(curl -sS --proto '=https' --proto-redir '=https' -o /dev/null -D - "$PROD_URL/pt/servicos/canalizador-porto/" | tr -d '\r' | grep -i '^x-nextjs-cache:' || true)
          echo "/pt/servicos/canalizador-porto/ : ${ENTETE:-x-nextjs-cache absent}"
          if ! printf '%s' "$ENTETE" | grep -qi 'HIT'; then
            echo "::warning::/pt/servicos/canalizador-porto/ n'est pas servie depuis le cache des pages pré-rendues (attendu x-nextjs-cache: HIT)."
          fi

      # Accueils : leur réponse dépend de la session (redirection, jeton rafraîchi), aucun cache partagé ne doit les
      # garder. Pré-rendus, ils ne restent en private, no-store que par l'en-tête du middleware (middleware.ts,
      # CACHE_CONTROL_PRIVE), qu'OpenNext fait passer avant celui de Next.
      - name: Vérifier que les accueils restent privés
        run: |
          for chemin in /pt/ /fr/; do
            ENTETE=$(curl -sS --proto '=https' --proto-redir '=https' -o /dev/null -D - "$PROD_URL$chemin" | tr -d '\r' | grep -i '^cache-control:' || true)
            echo "$chemin : ${ENTETE:-cache-control absent}"
            if ! printf '%s' "$ENTETE" | grep -qi 'private' || ! printf '%s' "$ENTETE" | grep -qi 'no-store'; then
              echo "::error::$chemin n'est pas en Cache-Control private, no-store : un cache partagé pourrait garder un accueil qui dépend de la session."
              exit 1
            fi
          done

      - name: Résumé
        if: success()
        run: echo "✓ Production smoke test passed — all endpoints healthy"

      - name: Alerte échec
        if: failure()
        run: |
          echo "::error::PRODUCTION SMOKE TEST FAILED — vérifier https://vitfix.io immédiatement"
          echo "Rollback: wrangler rollback ou redéployer le commit précédent via le workflow 'Deploy to Cloudflare Workers'"

  # ── IndexNow (ex indexnow-post-deploy.yml, lot 6 Aikido 28/10/2026) ──────────
  # Notifie Bing/Yandex/Naver/Seznam des URL de tous les sitemaps après chaque
  # déploiement de main réussi (smoke test compris). Un seul ping par déploiement.
  # Doc protocole : https://www.indexnow.org/documentation
  #
  # Clé IndexNow (lot 1 Aikido, 28/10/2026) : secret GitHub INDEXNOW_KEY, jamais de valeur dans le
  # dépôt. Le même secret est posé côté Cloudflare (wrangler secret put INDEXNOW_KEY) et servi à
  # https://vitfix.io/indexnow-key.txt par app/indexnow-key.txt/route.ts (keyLocation) — voir
  # lib/seo/indexnow.ts. Secret absent : ::warning:: et sortie 0, aucun ping.
  # Pas de checkout : le script n'utilise que curl, jq et gh (préinstallés sur le runner).
  indexnow:
    name: Ping IndexNow API
    needs: [deploy, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # SEO best-effort : n'altère jamais le statut du déploiement (comme l'ancien
    # post-deploy.yml, dont le ping était en continue-on-error). Un échec du ping
    # (sitemap injoignable, clé refusée, 5xx IndexNow) laisse le run vert : le job
    # apparaît en échec dans le graphe et ses annotations ::error:: dans le résumé.
    continue-on-error: true
    permissions:
      contents: read
      issues: write  # gh issue create / comment en cas de rate limit IndexNow (HTTP 429)
    env:
      HOST: vitfix.io
      # Endpoint principal : forwarde aux moteurs partenaires (Yandex, Naver, Seznam).
      ENDPOINT: https://api.indexnow.org/indexnow
      # Endpoint Bing direct (recommandé par Bing pour reliability + faster indexing).
      # Doc : https://www.bing.com/webmasters/help/indexnow-api
      BING_ENDPOINT: https://api.bing.com/IndexNow
      SITEMAP_INDEX: https://vitfix.io/sitemap.xml

    steps:
      - name: Fetch all sitemap URLs and ping IndexNow
        env:
          # gh CLI utilise GH_TOKEN pour créer/commenter une issue d'alerte en cas de
          # rate limit IndexNow (permission issues: write du job, pas du workflow).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secret INDEXNOW_KEY exposé à cette seule étape (moindre exposition), jamais
          # interpolé dans le script : lu depuis l'environnement.
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "::warning::Secret GitHub INDEXNOW_KEY absent — ping IndexNow ignoré"
            exit 0
          fi

          urls_file=$(mktemp)
          payload_file=$(mktemp)
          response_file=$(mktemp)
          trap 'rm -f "$urls_file" "$payload_file" "$response_file"' EXIT

          # Helper : extrait les <loc> d'un XML sans tuer le pipeline si vide
          # (grep retourne 1 quand zéro match → fatal sous pipefail sinon).
          extract_locs() {
            grep -oE '<loc>[^<]+</loc>' | sed 's|<loc>||;s|</loc>||' || true
          }

          # 1. Lire le sitemap index pour découvrir les sous-sitemaps réellement publiés.
          # Source de vérité : la prod elle-même (sitemap.xml renvoie ce qu'on indexe).
          # Robuste aux ajouts/suppressions de sitemaps (pas de hardcode SITEMAP_COUNT).
          echo "Fetching sitemap index $SITEMAP_INDEX..."
          index_xml=$(curl -sf --max-time 15 "$SITEMAP_INDEX" || echo "")
          if [ -z "$index_xml" ]; then
            echo "::error::Failed to fetch sitemap index"
            exit 1
          fi

          mapfile -t sub_sitemaps < <(echo "$index_xml" | extract_locs)
          echo "Sitemap index lists ${#sub_sitemaps[@]} sub-sitemaps"

          if [ "${#sub_sitemaps[@]}" -eq 0 ]; then
            echo "::error::No sub-sitemaps found in index"
            exit 1
          fi

          # 2. Fetch chaque sous-sitemap et accumule les URLs ligne par ligne.
          # Pas d'array bash → pas d'ARG_MAX même avec 10 000+ URLs.
          for sitemap_url in "${sub_sitemaps[@]}"; do
            echo "Fetching $sitemap_url..."
            xml=$(curl -sf --max-time 15 "$sitemap_url" || echo "")
            if [ -z "$xml" ]; then
              echo "::warning::Failed to fetch $sitemap_url, skipping"
              continue
            fi

            # 'wc -l' renvoie toujours un entier propre (0 pour fichier vide).
            # Eviter 'grep -c' ici: il sort code 1 si zero match, ce qui faisait
            # planter l'arithmetique sur la 1re iteration (file vide au depart).
            before=$(wc -l < "$urls_file")
            echo "$xml" | extract_locs >> "$urls_file"
            after=$(wc -l < "$urls_file")
            echo "  → $((after - before)) URLs collected from this sitemap"
          done

          total=$(wc -l < "$urls_file")
          echo "Collected $total URLs from sitemaps"

          if [ "$total" -eq 0 ]; then
            echo "::error::No URLs collected from sitemaps"
            exit 1
          fi

          # IndexNow accepte 10 000 URLs max par requête. Au-delà, on découpe.
          # On écrit aussi le payload sur disque pour éviter ARG_MAX côté curl.
          batch_size=10000
          start=1
          batch_num=1
          ok=0
          while [ "$start" -le "$total" ]; do
            end=$((start + batch_size - 1))
            jq -nc --rawfile urls_raw "$urls_file" \
              --arg host "$HOST" \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLoc "https://${HOST}/indexnow-key.txt" \
              --argjson startN "$start" \
              --argjson endN "$end" \
              '{
                host: $host,
                key: $key,
                keyLocation: $keyLoc,
                urlList: ($urls_raw | split("\n") | map(select(length > 0))[$startN-1:$endN])
              }' > "$payload_file"

            posted=$(jq '.urlList | length' "$payload_file")
            echo "Posting batch #$batch_num: $posted URLs (range $start-$end of $total)..."

            # POST principal vers indexnow.org (forwarde Yandex/Naver/Seznam).
            status=$(curl -sS -o "$response_file" -w "%{http_code}" \
              -X POST "$ENDPOINT" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary "@$payload_file")
            echo "IndexNow generic response: HTTP $status"
            head -c 500 "$response_file"; echo ""

            # POST direct vers Bing IndexNow endpoint (best-effort, parallèle).
            # Bing recommande l'appel direct pour reliability + faster indexing.
            # On ne fait pas échouer le job si Bing rejette : c'est un signal
            # supplémentaire, pas un canal critique.
            bing_status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              -X POST "$BING_ENDPOINT" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary "@$payload_file" || echo "000")
            echo "Bing direct response: HTTP $bing_status"

            case "$status" in
              200|202)
                ok=$((ok + posted))
                ;;
              422)
                echo "::warning::IndexNow batch #$batch_num returned 422 (some URLs may be invalid). Non-fatal."
                ok=$((ok + posted))
                ;;
              429)
                echo "::warning::IndexNow rate limit hit on batch #$batch_num after $ok URLs. Opening alert issue."
                # Crée une issue GitHub pour rendre l'incident visible (pas
                # besoin de Slack/email, gh CLI déjà disponible). Idempotent :
                # on cherche d'abord une issue ouverte avec le label seo-alert.
                if command -v gh >/dev/null 2>&1; then
                  existing=$(gh issue list --state open --label seo-alert --json number --jq '.[0].number' 2>/dev/null || echo "")
                  if [ -z "$existing" ]; then
                    gh issue create \
                      --title "IndexNow rate limit hit (HTTP 429)" \
                      --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\n${ok} URLs ont été pingées avant le rate limit sur batch #${batch_num}/${total} URLs total. Les batches restants ont été ignorés. Le ping reprendra automatiquement au prochain deploy." \
                      --label seo-alert \
                      || echo "::warning::Could not create alert issue"
                  else
                    gh issue comment "$existing" \
                      --body "Rate limit again on $(date -u +%Y-%m-%dT%H:%M:%SZ). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                      || echo "::warning::Could not comment alert issue"
                  fi
                fi
                break
                ;;
              *)
                echo "::error::IndexNow batch #$batch_num failed with HTTP $status"
                exit 1
                ;;
            esac

            start=$((end + 1))
            batch_num=$((batch_num + 1))
          done

          echo "::notice::IndexNow ping succeeded ($ok / $total URLs submitted)"

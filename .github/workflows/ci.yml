# ── CI — Build de production ──────────────────────────────────────────────────
# Vérifie que le build de production compile sans erreur.
# Les tests sont dans tests.yml (séparés pour parallélisme).

name: "CI — Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: "Build de production"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build de production
        run: bash scripts/ci-build-avec-reprise.sh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # Pages SEO pré-rendues au build (layouts par langue sans cookies() ni headers()). Une API dynamique ajoutée dans un
      # layout, une page ou un helper importé les ferait repasser en rendu à la demande sans faire échouer le build : la
      # garde lit .next/prerender-manifest.json (planchers par section, pages témoins, aucun revalidate).
      - name: Vérifier le pré-rendu des pages SEO
        run: node scripts/seo/verifier-prerendu.mjs

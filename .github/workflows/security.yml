# ── Sécurité — CodeQL, TruffleHog, Semgrep, Giskard, Trivy, Gitleaks ─────────
# Analyse statique, secrets, dépendances, OWASP, JWT et sécurité des agents IA.
# Déclenché sur push main, toutes les PR, et scan hebdomadaire.

name: "Sécurité — Analyse & Secrets"

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Aucune permission au niveau du workflow (lot 6 Aikido, 28/10/2026) : chaque job
# déclare le strict nécessaire (security-events: write pour les jobs qui envoient
# un SARIF, pull-requests: write pour le seul job qui commente la PR).
permissions: {}

jobs:
  # ── CodeQL — Analyse statique ──────────────────────────────────────────────
  codeql:
    name: "CodeQL — Analyse statique"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3.34.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3.34.1

      - name: Exécuter l'analyse CodeQL
        uses: github/codeql-action/analyze@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3.34.1
        with:
          category: "/language:${{ matrix.language }}"

  # ── TruffleHog — Détection de secrets ──────────────────────────────────────
  trufflehog:
    name: "TruffleHog — Scan de secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scanner les secrets (historique complet sur main)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          extra_args: --only-verified

      - name: Scanner les secrets (diff sur PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  # ── Semgrep — OWASP + Secrets + JWT ────────────────────────────────────────
  semgrep:
    name: "Semgrep — OWASP, Secrets & JWT"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      # Image épinglée par digest (zizmor unpinned-images, lot 6 Aikido) : digest du
      # manifeste multi-arch de semgrep/semgrep:latest = 1.181.1 au 28/10/2026.
      image: semgrep/semgrep:1.181.1@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Exécuter Semgrep
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/secrets
          --config p/jwt
          --sarif --output semgrep-results.sarif .

      - name: Uploader les résultats dans GitHub Security
        uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3 # v3.34.1
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # ── Trivy — Scan vulnérabilités dépendances ─────────────────────────────────
  trivy:
    name: "Trivy — Dépendances"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: 'security/.trivyignore'

      - name: Trivy (HIGH — warning only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: 'security/.trivyignore'

  # ── Giskard — Sécurité agents IA (injection prompt, hallucinations) ────────
  giskard-ai:
    name: "Giskard — Sécurité prompts IA"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # dorny/paths-filter lit les fichiers de la PR (lecture) et github-script
      # commente la PR (écriture).
      pull-requests: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Vérifier si des fichiers IA ont changé
        id: ai-changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            ai:
              - 'app/api/fixy-ai/**'
              - 'app/api/fixy-chat/**'
              - 'app/api/simulateur-travaux/**'
              - 'app/api/materiaux-ai/**'
              - 'app/api/email-agent/**'
              - 'app/api/syndic/max-ai/**'
              - 'app/api/syndic/analyse-devis/**'
              - 'app/api/client/analyse-devis/**'
              - 'app/api/comptable-ai/**'
              - 'app/api/copro-ai/**'
              - 'app/api/receipt-scan/**'
              - 'lib/groq.ts'
              - 'lib/rapport-ia.ts'
              - 'lib/claude.ts'
              - 'lib/copro-ia-contexte.ts'
              - 'lib/copro-demo-data.ts'
              - 'lib/administrateur-judiciaire/ia/**'
              - 'app/api/administrateur-judiciaire/**'

      - name: Configurer Python
        if: steps.ai-changes.outputs.ai == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Installer Giskard
        if: steps.ai-changes.outputs.ai == 'true'
        # Version épinglée (lot 6 Aikido) : 2.19.2 est la dernière compatible Python 3.11
        # (giskard 3.x exige Python ≥ 3.12), c'est celle que `pip install giskard` résolvait.
        run: pip install giskard==2.19.2

      - name: Scanner les prompts pour injections et fuites
        if: steps.ai-changes.outputs.ai == 'true'
        continue-on-error: ${{ secrets.GISKARD_API_KEY == '' }}
        env:
          GISKARD_API_KEY: ${{ secrets.GISKARD_API_KEY }}
        run: |
          if [ -z "$GISKARD_API_KEY" ]; then
            echo "::warning::GISKARD_API_KEY non configuré — scan ignoré"
            exit 0
          fi

          python3 << 'SCRIPT'
          import subprocess, sys, json, os, re, glob

          # Extraire les system prompts des fichiers d'agents
          agent_files = glob.glob("app/api/**/route.ts", recursive=True)
          prompt_count = 0
          issues = []

          for f in agent_files:
              with open(f) as fh:
                  content = fh.read()
              # Détecter les blocs system prompt (heuristique)
              if "role: 'system'" in content or 'role: "system"' in content:
                  prompt_count += 1
                  # Vérifications basiques de sécurité
                  if "ignore previous" in content.lower():
                      issues.append(f"{f}: contient 'ignore previous' — risque d'injection")
                  if re.search(r'(password|secret|api.?key)\s*[:=]', content, re.I):
                      issues.append(f"{f}: potentielle fuite de credentials dans le prompt")

          print(f"Scanné {prompt_count} agents avec prompts système")
          if issues:
              for issue in issues:
                  print(f"::error::{issue}")
              sys.exit(1)
          else:
              print("Aucun problème de sécurité détecté dans les prompts")
          SCRIPT

      - name: Poster résultat sur la PR
        if: steps.ai-changes.outputs.ai == 'true' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Scan sécurité IA (Giskard)\n\nScan des prompts système terminé. Voir les logs du workflow pour le détail.'
            });

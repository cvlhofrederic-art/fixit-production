name: Léa documents — Process pending OCR/extraction

# Safety net : déclenche /api/syndic/lea-documents/process toutes les 15 min
# pour rattraper les documents pending non traités (cas où le fire-and-forget
# post-upload échoue).

on:
  schedule:
    - cron: '*/15 * * * *'  # toutes les 15 min
  workflow_dispatch: {}

# Aucune permission (lot 6 Aikido, 28/10/2026) : le job n'utilise pas le jeton GitHub.
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger process endpoint
        env:
          # Secret lu depuis l'environnement, jamais interpolé dans run:.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST https://vitfix.io/api/syndic/lea-documents/process \
            -H "x-cron-key: ${CRON_SECRET}" \
            --fail-with-body

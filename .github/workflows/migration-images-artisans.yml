name: Migration ponctuelle — images d'artisan vers Storage

# Lot 3 de l'analyse Sentry du 28/10/2026 (PR #576) : déplace dans Supabase Storage les photos de profil et logos
# d'artisan encore enregistrés en data: URL base64 dans profiles_artisan (scripts/migrer-images-artisans-storage.ts,
# logique dans lib/storage/migrer-images-artisan.ts). Lancement manuel seulement, SIMULATION par défaut : cocher
# « appliquer » pour écrire. La clé service_role reste un secret GitHub et ne quitte jamais le runner.
# Ensuite, dans l'éditeur SQL Supabase : comptage de contrôle à 0, puis 20261028a et 20261028b.
# Workflow ponctuel, à supprimer une fois la migration faite.

on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "Écrire (envois Storage et mises à jour) ; décoché : simulation"
        type: boolean
        default: false
      limite:
        description: "Nombre maximal de valeurs à migrer (vide : toutes)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: migration-images-artisans
  cancel-in-progress: false

jobs:
  migrer:
    name: Migrer les images d'artisan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tsx n'est pas une dépendance du projet et npx est proscrit dans les workflows : le script et sa logique sont
      # compilés en CommonJS par le tsc du projet, puis lancés par Node.
      - name: Compiler le script
        run: ./node_modules/.bin/tsc scripts/migrer-images-artisans-storage.ts --outDir .migration-images --rootDir . --module commonjs --moduleResolution node --target es2022 --esModuleInterop --skipLibCheck --strict --types node

      - name: Migration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLIQUER: ${{ inputs.appliquer }}
          LIMITE: ${{ inputs.limite }}
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLIQUER" = "true" ]; then args+=(--appliquer); fi
          if [ -n "$LIMITE" ]; then
            case "$LIMITE" in
              *[!0-9]*) echo "::error::limite invalide : un entier positif est attendu"; exit 1 ;;
            esac
            args+=("--limite=$LIMITE")
          fi
          node .migration-images/scripts/migrer-images-artisans-storage.js "${args[@]}"

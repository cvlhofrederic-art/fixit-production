<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Vitfix Pro</title>
  <!--
    Page locale de l'appli Vitfix Pro (server.errorPath de capacitor.config.ts) : affichée quand le site ne répond pas
    (réseau coupé ; sous Android, aussi une erreur HTTP de page entière). Le bouton est un simple lien vers le point de
    départ de l'appli (server.url + server.appStartPath), gardé par tests/mobile/capacitor-config.test.ts.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
      background: #ffffff; color: #1f2937; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 360px; }
    .marque { display: inline-block; padding: 6px 14px; border-radius: 999px; background: #FFC107; font-weight: 700; }
    h1 { font-size: 1.375rem; line-height: 1.3; margin: 24px 0 12px; }
    p { color: #4b5563; line-height: 1.5; margin: 0 0 28px; }
    .bouton {
      display: inline-block; min-height: 48px; padding: 14px 28px; border-radius: 12px;
      background: #1f2937; color: #ffffff; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <span class="marque">Vitfix Pro</span>
    <h1 id="titre">Impossible d’afficher Vitfix Pro</h1>
    <p id="texte">Vérifiez votre connexion Internet, puis réessayez. Si le problème continue, réessayez dans quelques minutes.</p>
    <a class="bouton" id="reessayer" href="https://vitfix.io/pro/mobile/">Réessayer</a>
  </main>
  <script>
    // Portugais si le téléphone est réglé en portugais, français sinon.
    if ((navigator.language || '').toLowerCase().indexOf('pt') === 0) {
      document.documentElement.lang = 'pt';
      document.getElementById('titre').textContent = 'Não foi possível abrir a Vitfix Pro';
      document.getElementById('texte').textContent =
        'Verifique a sua ligação à Internet e tente novamente. Se o problema persistir, tente daqui a alguns minutos.';
      document.getElementById('reessayer').textContent = 'Tentar novamente';
    }
  </script>
</body>
</html>

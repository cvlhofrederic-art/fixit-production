# ── SonarQube Cloud — périmètre de l'analyse automatique ─────────────────────
# Le projet cvlhofrederic-art_fixit-production est en « Automatic Analysis ».
# Dans ce mode, SonarQube Cloud lit CE fichier, à la racine de la branche par
# défaut (main), et ignore sonar-project.properties.
# Doc : https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Clés prises en charge (JS/TS) : sonar.sources, sonar.exclusions,
# sonar.inclusions, sonar.tests, sonar.test.exclusions, sonar.test.inclusions,
# sonar.sourceEncoding, sonar.cpd.exclusions. Toute autre clé est ignorée sans
# avertissement : le seuil de duplication (minimumTokens), les rapports lcov,
# sonar.qualitygate.wait et sonar.newCode.referenceBranch n'ont pas d'équivalent.
# - Les motifs *, ** et ? sont admis dans les clés *.exclusions ;
#   sonar.sources et sonar.tests n'acceptent que des chemins simples.
# - Pour une même clé, la valeur de ce fichier remplace celle de l'interface
#   (Administration > General Settings > Analysis Scope), sans cumul.
# - Une liste par ligne : la continuation par « \ » n'est pas documentée ici.
#
# Valeurs reprises telles quelles de sonar-project.properties : garder les deux
# fichiers synchronisés tant que ce dernier est conservé.

# Exclusions full (pas analysées du tout) : code vendored/minifié/données pures
# - recipes/** : 162 recettes = pure data (schema Zod + ratios), non du code
#   à auditer. Le LLM quality gate de SonarCloud fausse le ratio "duplication"
#   car les recettes FR/PT partagent volontairement la même structure de type
#   Recipe. Leur analyse n'apporte aucune valeur qualité/sécurité.
# - data/pt/** : standards + fabricants = dictionnaires statiques.
# - app/*/ville, /services, /specialites, /servicos, /cidade, /urgencia :
#   templates SEO localisés par slug (patterns structurels identiques par
#   design — duplication intentionnelle pour SEO long-tail).
# - app/fr/plan-du-site, app/pt/mapa-do-site : HTML sitemaps bilingues
#   miroirs FR/PT par design (UX + maillage interne).
# - lib/data/seo-pages-data.ts, lib/data/fr-seo-pages-data.ts : data files
#   contenant 22 villes PT + 19 villes FR avec structure identique (specialty,
#   climateChallenges, notableFreguesias, serviceCityOverrides...). Le contenu
#   string est unique par ville mais la structure est répétitive par design TS
#   (CityData interface). SonarCloud flag "65% duplication" est un faux positif.
sonar.exclusions=node_modules/**,out/**,.next/**,android/**,ios/**,public/**,supabase/migrations/**,.claude/**,scripts/**,lib/estimation-materiaux/recipes/**,lib/estimation-materiaux/data/**,lib/data/**,lib/data/*.ts,**/seo-pages-data.ts,**/fr-seo-pages-data.ts,**/en-services-data.ts,**/fr-blog-data.ts,**/investor-pages-data.ts,app/fr/ville/**,app/fr/services/**,app/fr/specialites/**,app/pt/servicos/**,app/pt/cidade/**,app/pt/urgencia/**,app/en/[slug]/**,app/es/[slug]/**,app/fr/plan-du-site/**,app/pt/mapa-do-site/**

# Copy-Paste-Detection : ceinture + bretelles (même si déjà dans exclusions).
# lib/syndic/prompts/** : prompts agents IA splittés FR/PT par design (isolation
# locale stricte requise par spec §3.10 — Max FR ne doit jamais citer loi PT
# et vice-versa). La duplication entre `*-fr.ts` et `*-pt.ts` est intentionnelle.
# lib/cerebras.ts : client OpenAI-compatible mirror exact de lib/groq.ts pour le
# fallback inter-provider sur rate-limit Groq. Mêmes shapes (auth, retry, models)
# par design — ce sont deux clients provider parallèles.
# tests/lib/cerebras.test.ts : mêmes patterns de tests que tests/lib/groq.test.ts
# par design (clients symétriques).
sonar.cpd.exclusions=lib/estimation-materiaux/recipes/**,lib/estimation-materiaux/data/**,lib/data/**,lib/data/*.ts,**/seo-pages-data.ts,**/fr-seo-pages-data.ts,**/en-services-data.ts,**/fr-blog-data.ts,**/investor-pages-data.ts,app/fr/ville/**,app/fr/services/**,app/fr/specialites/**,app/pt/servicos/**,app/pt/cidade/**,app/pt/urgencia/**,app/fr/plan-du-site/**,app/pt/mapa-do-site/**,lib/syndic/prompts/**,lib/cerebras.ts,tests/lib/cerebras.test.ts
